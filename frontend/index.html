<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Raleway', sans-serif;
            background-color: #0a0e27;
            color: #00ff00;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: rgba(0,0,0,0.8);
            padding: 40px;
            border: 1px solid #00ff00;
            border-radius: 10px;
            width: 350px;
            text-align: center;
        }
        h1 { margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #00ff00;
            border-radius: 5px;
            background: #0a0e27;
            color: #00ff00;
        }
        button {
            padding: 10px 20px;
            margin-top: 15px;
            border: none;
            border-radius: 5px;
            background-color: #00ff00;
            color: #000;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #00cc00; }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>Sentinel Login</h1>
        <input type="email" id="emailInput" placeholder="Email" required><br>
        <input type="password" id="passwordInput" placeholder="Password" required><br>
        <button id="loginBtn">Login</button>
    </div>

    <script>
        document.getElementById("loginBtn").addEventListener("click", () => {
            const email = document.getElementById("emailInput").value.trim();
            const password = document.getElementById("passwordInput").value.trim();

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            // Send login request to backend
            fetch("http://localhost:5000/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email, password })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success){
                    // Store email for dashboard use
                    sessionStorage.setItem("email", email);
                    // Redirect to dashboard
                    window.location.href = "dashboard.html";
                } else {
                    alert("Invalid email or password.");
                }
            })
            .catch(err => {
                console.error("Login error:", err);
                alert("Could not connect to server.");
            });
        });
    </script>
</body>
</html>
