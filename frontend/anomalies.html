<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel Anomalies</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #222; color: #fff; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; }
    #anomalyList { padding: 1rem; display: flex; flex-direction: column; gap: 0.8rem; }
    .anomaly-card { padding: 1rem; border-radius: 8px; cursor: pointer; }
    .anomaly-card.low { background: #d4edda; }
    .anomaly-card.medium { background: #fff3cd; }
    .anomaly-card.high { background: #f8d7da; }
    #detailsPanel { padding: 1rem; border-top: 2px solid #ccc; margin-top: 1rem; }
    .actions button { margin-right: 0.5rem; padding: 0.3rem 0.6rem; border: none; border-radius: 4px; cursor: pointer; }
    .confirm { background: #28a745; color: #fff; }
    .report { background: #dc3545; color: #fff; }
    #riskSection { display: flex; align-items: center; gap: 1rem; padding: 1rem; }
    #riskCircle { width: 60px; height: 60px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: bold; }
    #riskText { font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>Sentinel Dashboard</h1>
    <div id="profileSection">
      <span id="profileIcon">👤</span>
      <div id="profileDropdown" style="display:none; position:absolute; background:#fff; border:1px solid #ccc; padding:0.5rem;">
        <button onclick="goToUserDetails()">Profile</button><br>
        <button onclick="goToSettings()">Settings</button><br>
        <button id="logoutBtn">Logout</button>
      </div>
    </div>
  </header>

  <section id="riskSection">
    <div id="riskCircle">0</div>
    <div id="riskText">Low risk</div>
  </section>

  <section id="anomalyList">
    <!-- Anomaly cards will be injected here dynamically -->
  </section>

  <section id="detailsPanel">
    <h2>🔍 Select an anomaly to see details</h2>
  </section>

  <script src="dashboard.js"></script>
</body>
</html>
