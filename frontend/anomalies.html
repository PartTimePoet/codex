<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sentinel - Anomalies</title>

  <!-- Raleway Font -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600;700&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="anomalies.css">
</head>
<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <img src="assets/logo.png" class="logo">
    </div>

    <nav class="nav-center">
      <a href="dashboard.html">Dashboard</a>
      <a href="anomalies.html" class="active">Anomalies</a>
      <a href="reports.html">Reports</a>
    </nav>

    <div class="nav-right">
      <div class="profile-wrapper">
        <div class="profile-icon" id="profileIcon">👤</div>
        <div class="profile-dropdown" id="profileDropdown">
          <button onclick="goToUserDetails()">User Details</button>
          <button onclick="goToSettings()">Settings</button>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>
  </header>

  <!-- TITLE -->
  <section class="title">
    <h1>🚨 Anomaly Detection Center</h1>
  </section>

  <!-- MAIN -->
  <div class="container">
    <!-- LEFT: ANOMALY LIST -->
    <div class="anomaly-list" id="anomalyList">
      <p>Loading anomalies...</p>
    </div>

    <!-- RIGHT: DETAILS PANEL -->
    <div class="details-panel" id="detailsPanel">
      <h2>Details</h2>
      <p>Select an anomaly to view details</p>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
    const list = document.getElementById("anomalyList");
    const details = document.getElementById("detailsPanel");

    // NAVBAR DROPDOWN
    const icon = document.getElementById("profileIcon");
    const dropdown = document.getElementById("profileDropdown");

    icon.onclick = () => dropdown.classList.toggle("show");
    window.onclick = (e) => {
      if (!icon.contains(e.target) && !dropdown.contains(e.target)) {
        dropdown.classList.remove("show");
      }
    };

    document.getElementById("logoutBtn").onclick = () => {
      localStorage.clear();
      window.location.href = "login.html";
    };

    // NAVIGATION FUNCTIONS
    window.goToUserDetails = () => window.location.href = "user-details.html";
    window.goToSettings = () => window.location.href = "settings.html";

    // RENDER ANOMALIES FROM BACKEND
    async function updateAnomalies() {
      try {
        const response = await fetch("http://127.0.0.1:5000/analyze");
        const data = await response.json();

        list.innerHTML = ""; // clear previous anomalies

        data.timeline.forEach((eventStr) => {
          let severity = "low";
          if (data.risk_score > 80) severity = "high";
          else if (data.risk_score > 50) severity = "medium";

          const div = document.createElement("div");
          div.className = `anomaly-card ${severity}`;
          div.innerHTML = `
            <h3>⚠ Anomaly Detected</h3>
            <p>${eventStr}</p>
            <p>Severity: ${severity.toUpperCase()}</p>
          `;

          div.addEventListener("click", () => {
            details.innerHTML = `
              <h2>🔍 Anomaly Details</h2>
              <p><strong>Event:</strong> ${eventStr}</p>
              <p><strong>Severity:</strong> ${severity}</p>
              <p><strong>Explanation:</strong> ${data.explanation}</p>
              <div class="actions">
                <button class="confirm">✅ Confirm</button>
                <button class="report">❌ Report</button>
              </div>
            `;
          });

          list.appendChild(div);
        });
      } catch (error) {
        console.error("Error fetching anomalies:", error);
        list.innerHTML = "<p>Error loading anomalies.</p>";
      }
    }

    updateAnomalies();
    setInterval(updateAnomalies, 5000); // refresh every 5 seconds
  });
  </script>
</body>
</html>
