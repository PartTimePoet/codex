<!DOCTYPE html>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>User Details</title>

  <!-- Raleway Font -->
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="user-details.css">
</head>

</head>
<body>
  <!-- NAVBAR -->
  <header class="navbar">

    <!-- LEFT: LOGO -->
    <div class="nav-left">
      <img src="assets/logo.png" alt="Sentinel logo" class="logo">
    </div>

    <!-- CENTER: NAV LINKS -->
    <nav class="nav-center">
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="anomalies.html">Anomalies</a>
      <a href="reports.html">Reports</a>
    </nav>

    <!-- RIGHT: PROFILE -->
    <div class="nav-right">
      <div class="profile-wrapper">
        <div class="profile-icon" id="profileIcon">👤</div>

        <div class="profile-dropdown" id="profileDropdown">
          <button onclick="goToUserDetails()">User Details</button>
          <button onclick="goToSettings()">Settings</button>
          <button id="logoutBtn">Logout</button>
        </div>
      </div>
    </div>

  </header>
<body>

  <div class="container">

    <h1>User Profile</h1>

    <div class="profile-card">

      <!-- LEFT: PHOTO -->
      <div class="photo-section">
        <img src="assets/user.jpg" alt="User Photo" id="userPhoto">
      </div>

      <!-- RIGHT: DETAILS -->
      <div class="details-section">
        <p><strong>Username:</strong> <span id="username">JohnDoe</span></p>
        <p><strong>Email:</strong> <span id="email">john@example.com</span></p>
        <p><strong>Company:</strong> <span id="company">Sentinel Inc.</span></p>
      </div>

    </div>

    <!-- ATTENDANCE -->
    <div class="attendance-card">
      <h2>Attendance</h2>
      <canvas id="attendanceChart"></canvas>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="user-details.js"></script>

</body>
</html>
